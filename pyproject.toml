[project]
name = "robin"
version = "0.1.0"
description = "Privacy-first household assistant core"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "cryptography>=44",
    "gliner>=0.2.22",
    "mcp>=2.0",
    "patchright>=1.49",
    "playwright>=1.49",
    "protobuf>=7.36.2",
]

[project.optional-dependencies]
photos = ["open-clip-torch>=2.24", "pillow>=10"]
camoufox = ["camoufox[geoip]>=0.4"]
docs = ["pypdf>=5"]

[project.scripts]
robin = "robin.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
